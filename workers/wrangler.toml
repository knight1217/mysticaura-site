# MysticAura Worker
name = "mysticaura-api-proxy"
main = "api-proxy.js"
compatibility_date = "2025-05-30"

# Cloudflare Workers AI binding (free, no setup needed)
[ai]
binding = "AI"

# Optional: KV for rate limiting
# [[kv_namespaces]]
# binding = "MYSTIC_RATE"
# id = "your-kv-id"

[vars]
# Set via: npx wrangler secret put DEEPSEEK_API_KEY
# DEEPSEEK_API_KEY = "your-key-here"
