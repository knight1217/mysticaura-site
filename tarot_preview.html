<!DOCTYPE html>
<html lang="zh">
<head><meta charset="UTF-8"><title>水墨淡彩 — 三种牌面测试</title>
<style>
body { background:#0f0f1a; color:#ccc; font-family:Georgia,serif; text-align:center; padding:20px; }
h2 { color:#d4a574; margin-bottom:4px; }
.sub { color:#777; font-size:13px; margin-bottom:20px; }
.grid { display:flex; flex-wrap:wrap; gap:20px; justify-content:center; }
.card { background:#1a1a2e; border:2px solid #333; border-radius:12px; padding:14px; width:280px; }
.card img { width:100%; border-radius:8px; display:block; }
.label { margin-top:10px; color:#d4a574; font-size:16px; font-weight:bold; }
.desc { color:#888; font-size:12px; margin-top:4px; }
</style></head>
<body>
<h2>水墨淡彩风格 · 三张不同牌面</h2>
<div class="sub">The Moon · The Sun · Death | 水墨线稿 + 淡彩晕染 + 金边框</div>
<div class="grid">
<div class="card">
  <img src="img/tarot/ink_moon.png">
  <div class="label">🌙 The Moon 月亮</div>
  <div class="desc">紫灰调 | 满月倒影 | 龙虾·狼犬·双塔</div>
</div>
<div class="card">
  <img src="img/tarot/ink_sun.png">
  <div class="label">☀️ The Sun 太阳</div>
  <div class="desc">金黄调 | 小孩白马 | 向日葵花田</div>
</div>
<div class="card">
  <img src="img/tarot/ink_death.png">
  <div class="label">🦋 Death 死神</div>
  <div class="desc">灰玫调 | 骷髅骑士 | 白玫瑰旗帜</div>
</div>
</div>
</body>
</html>
